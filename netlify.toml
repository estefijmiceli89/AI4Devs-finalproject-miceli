[build]
  base = "petcharms"
  command = "npm run build"
  functions = "petcharms/netlify/functions"
  publish = "petcharms/dist/spa"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"
  
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"
  
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
